[package]
name = "cindral-calculator"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
description = "A considered, keyboard-first desktop calculator"
license = "MIT"

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "persistence", "accesskit"] }
rust_decimal = { version = "1.43", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[package.metadata.bundle]
name = "Calculator"
identifier = "com.cindral.calculator"
category = "Utility"
short_description = "A keyboard-first desktop calculator"
